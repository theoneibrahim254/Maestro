name: Deploy Maestro preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "maestro.html"
      - "portfolio.html"
      - "maestro-hero.svg"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare public static preview
        run: |
          mkdir site
          cp index.html site/index.html
          cp maestro.html site/maestro.html
          cp portfolio.html site/portfolio.html
          cp maestro-hero.svg site/maestro-hero.svg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy public preview
        id: deployment
        uses: actions/deploy-pages@v4
